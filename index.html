<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Brand / tab -->
    <title>California Energy Intelligence OS</title>
    <meta
      name="description"
      content="California Energy Intelligence OS — research, planning, and developer dashboard for California electricity systems."
    />
    <meta name="author" content="David T Phung" />
    <meta name="application-name" content="California Energy Intelligence OS" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ceios-theme')
          if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {}
      })()
    </script>

    <!-- Favicons (sky → emerald brand mark) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph (link previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="California Energy Intelligence OS" />
    <meta property="og:title" content="California Energy Intelligence OS" />
    <meta
      property="og:description"
      content="Research, planning, and developer dashboard for California electricity systems — capacity, scenarios, and clean energy pathways."
    />
    <meta property="og:url" content="https://california-energy-intelligence-os.vercel.app/" />
    <meta property="og:image" content="https://california-energy-intelligence-os.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="California Energy Intelligence OS — sky and emerald energy dashboard" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@davidtphung" />
    <meta name="twitter:creator" content="@davidtphung" />
    <meta name="twitter:title" content="California Energy Intelligence OS" />
    <meta
      name="twitter:description"
      content="Research, planning, and developer dashboard for California electricity systems."
    />
    <meta name="twitter:image" content="https://california-energy-intelligence-os.vercel.app/og-image.png" />
    <meta name="twitter:image:alt" content="California Energy Intelligence OS brand card" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

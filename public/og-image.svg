<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="California Energy Intelligence OS">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="brand" x1="80" y1="80" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="orb" cx="85%" cy="20%" r="45%">
      <stop stop-color="#0ea5e9" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="15%" cy="90%" r="40%">
      <stop stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#page)"/>
  <rect width="1200" height="630" fill="url(#orb)"/>
  <rect width="1200" height="630" fill="url(#orb2)"/>

  <!-- Grid lines -->
  <g stroke="#38bdf8" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 105 H1200 M0 210 H1200 M0 315 H1200 M0 420 H1200 M0 525 H1200"/>
    <path d="M100 0 V630 M250 0 V630 M400 0 V630 M550 0 V630 M700 0 V630 M850 0 V630 M1000 0 V630"/>
  </g>

  <!-- Brand mark -->
  <rect x="88" y="160" width="96" height="96" rx="24" fill="url(#brand)"/>
  <path d="M146 178 110 228h22l-5 36 36-50h-22l5-36z" fill="#ffffff"/>

  <!-- Title -->
  <text x="214" y="210" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="48" font-weight="700" letter-spacing="-0.02em">
    California Energy Intelligence OS
  </text>
  <text x="214" y="252" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="500">
    Research · Planning · Data Engineering · API-ready
  </text>

  <!-- Accent bar -->
  <rect x="214" y="278" width="180" height="4" rx="2" fill="url(#accent)"/>

  <!-- Feature chips -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600">
    <rect x="214" y="320" width="168" height="44" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="236" y="348" fill="#7dd3fc">Overview KPIs</text>

    <rect x="398" y="320" width="188" height="44" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="420" y="348" fill="#6ee7b7">Scenario Planner</text>

    <rect x="602" y="320" width="156" height="44" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="624" y="348" fill="#94a3b8">Research Hub</text>
  </g>

  <!-- Footer -->
  <text x="88" y="560" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="500">
    Built by David T Phung · california-energy-intelligence-os.vercel.app
  </text>
  <text x="88" y="590" fill="#475569" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14">
    Sky · Emerald · Slate energy systems theme
  </text>
</svg>
